<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Esse Klippet</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap" style="padding-top:40px">
  <h2>Bokningar</h2>
  <div class="card" id="login" hidden>
    <label for="pw">Lösenord</label><input id="pw" type="password">
    <p><button class="btn" id="in">Logga in</button></p><div class="sub" id="err"></div>
  </div>
  <div class="card tablewrap" id="list" hidden>
    <table><thead><tr><th>Datum</th><th>Tid</th><th>Frisör</th><th>Tjänst</th><th>Kund</th><th>Telefon</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
    <p class="sub" id="empty">Inga kommande bokningar.</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="api.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
  try{
    const l=(await API.list(new Date().toISOString().slice(0,10))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    $("login").hidden=true;$("list").hidden=false;$("empty").hidden=l.length>0;
    $("rows").innerHTML=l.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.time)}</td><td>${esc(b.staff)}</td><td>${esc(b.service)}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td><button class="btn alt" data-id="${esc(b.id)}">Avboka</button></td></tr>`).join("");
  }catch(e){if(e.status===401){$("login").hidden=false;$("list").hidden=true}}
}
$("in").onclick=async()=>{try{await API.login($("pw").value);load()}catch{$("err").textContent="Fel lösenord."}};
$("rows").onclick=async e=>{const id=e.target.dataset.id;if(id&&confirm("Avboka tiden?")){await API.remove(id);load()}};
load();
</script>
</body>
</html>
